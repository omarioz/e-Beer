services:
  - type: web
    name: ebeer-api
    env: python
    plan: free
    pythonVersion: "3.11.0"
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: python -m gunicorn ebeer_api.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: ebeer_api.settings_production
      - key: DB_NAME
        fromDatabase:
          name: ebeer-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ebeer-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ebeer-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: ebeer-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ebeer-db
          property: port

databases:
  - name: ebeer-db
    plan: free